{% extends "base.html" %}
{% block title %}Редактирование оборудования — Service Desk{% endblock %}
{% block content %}
<div class="page-heading">
    <div>
        <div class="eyebrow">СПРАВОЧНИК</div>
        <h1>Редактирование оборудования</h1></div>
</div>
<form method="post" class="form-card needs-validation"><input type="hidden" name="_csrf_token"
                                                              value="{{ csrf_token() }}">
    <label>Название<input name="name" required maxlength="160" value="{{ equipment.name }}"></label><label>Инвентарный
        номер<input name="number" required maxlength="80" value="{{ equipment.number }}"></label><label>Стоимость,
        ₽<input name="cost" type="number" min="0" step="0.01" required value="{{ equipment.cost }}"></label>
    <div class="form-actions">
        <button class="btn btn-primary primary" type="submit">Сохранить</button>
        <a class="btn" href="{{ url_for('equipment') }}">Отмена</a></div>
</form>
{% endblock %}
