{% extends "base.html" %}
{% block title %}Ошибка {{ code }} — Service Desk{% endblock %}
{% block content %}
<div class="error-card">
    <div class="error-code">{{ code }}</div>
    <h1>Не удалось выполнить действие</h1>
    <p class="muted">{{ message }}</p><a class="btn primary"
                                         href="{{ url_for('index') if current_user else url_for('login') }}">Вернуться
    назад</a></div>{% endblock %}
